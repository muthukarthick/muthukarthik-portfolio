  <text x="40" y="432" fill="#a1a1aa" font-family="sans-serif" font-size="11">Tech Stack: PHP • Laravel • React • MySQL • Redis • Payment APIs • Webhooks • i18n</text>
  <circle cx="750" cy="427" r="4" fill="#10b981"/>
